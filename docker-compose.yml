services:
  dc-music-bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dc-music-bot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Container-internal path; overrides the host path from .env
      YTDLP_COOKIES_FILE: /app/cookies.txt
    volumes:
      # NOTE: must be writable (no ":ro"). yt-dlp dumps its refreshed cookie jar
      # back into this file on exit; a read-only mount crashes every extraction
      # at exit with "OSError: Read-only file system".
      - ./cookies.txt:/app/cookies.txt
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
