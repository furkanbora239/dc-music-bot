services:
  # bgutil PO token provider: makine üretimi proof-of-origin token'larla
  # datacenter IP'lerin YouTube "Sign in to confirm you're not a bot" duvarını
  # aşmasını sağlar. Hesap/cookie gerekmez, tamamen otomatiktir.
  # Sadece compose ağı içinden erişilir; dışarıya port yayınlamıyoruz.
  bgutil-provider:
    image: brainicism/bgutil-ytdlp-pot-provider:latest
    container_name: bgutil-provider
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # Token üretimi CPU/JS ağırlıklı; bot kadar değil ama sıkı da değil.
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 320M
        reservations:
          memory: 64M
    healthcheck:
      # Imajda curl/wget yok ama node var; /ping endpoint'ini node ile yokluyoruz.
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:4416/ping',r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  dc-music-bot:
    build:
      context: .
      dockerfile: Dockerfile
    image: dc-music-bot:latest
    container_name: dc-music-bot
    restart: unless-stopped          # Çökerse yeniden başlat; sunucu reboot sonrası Docker ile birlikte ayağa kalkar

    depends_on:
      bgutil-provider:
        condition: service_healthy

    env_file:
      - .env

    environment:
      # Log zaman damgalarının doğru olması için (opsiyonel, ihtiyacına göre değiştir)
      TZ: Europe/Istanbul
      # Botu bgutil sağlayıcısına bağlar; compose ağındaki servis adına gider.
      YTDLP_POT_BASE_URL: http://bgutil-provider:4416

    # SIGTERM sonrası botun temiz kapanması (ses bağlantısını bırakması) için bekleme süresi
    stop_grace_period: 30s

    # PID 1 olarak init kullanılır: sinyal iletimi ve zombie temizliği için daha güvenlidir
    init: true

    # Bot HTTP servisi açmadığı için süreç kontrolü yapılır. `-f` kullanılmıyor:
    # -f sağlık kontrolünü çalıştıran shell'in kendi komut satırıyla da eşleşip
    # her zaman "healthy" sonucu üretirdi. İsim üzerinden eşleşme yeterli.
    healthcheck:
      test: ["CMD-SHELL", "pgrep dc-music-bot >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

    # Data center IP'lerinde YouTube'un "Sign in to confirm you're not a bot"
    # duvarına karşı kurtarma yolu. Kullanmak için aynı dizine bir cookies.txt
    # koy, aşağıdaki volume bloğunu aç ve .env içinde YTDLP_COOKIES_FILE=/app/cookies.txt
    # yaz — sonra: docker compose up -d
    # ÖNEMLİ: mount YAZILABİLİR olmalı (:ro ekleme!), yt-dlp çıkışta cookie
    # kavanozunu dosyaya geri yazıyor; salt-okunur mount her çözümlemeyi çökertir.
    # volumes:
    #   - ./cookies.txt:/app/cookies.txt

    # 1. Kaynak Tüketim Limitleri (Sunucuyu korur, OOM engeller)
    # Not: Bellek 256M -> 512M çıkarıldı. Aynı anda birden fazla sunucuda çalarken
    # ffmpeg + yt-dlp süreçleri düşük limitte OOM-kill ile restart döngüsüne girebiliyor.
    deploy:
      resources:
        limits:
          cpus: "1.50"
          memory: 512M
        reservations:
          memory: 96M

    # 2. RAM Tabanlı Hızlı /tmp (Disk I/O ve SSD yıpranmasını sıfırlar)
    tmpfs:
      - /tmp:size=64M,exec

    # 3. Güvenlik İzolasyonu
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

    # 4. Log Yönetimi (Disk dolmasını önler)
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
