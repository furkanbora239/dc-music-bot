services:
  dc-music-bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dc-music-bot
    restart: unless-stopped
    env_file:
      - .env

    # 1. Kaynak Tüketim Limitleri (Sunucuyu korur, OOM engeller)
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 256M
        reservations:
          memory: 40M

    # 2. RAM Tabanlı Hızlı /tmp (Disk I/O ve SSD yıpranmasını sıfırlar)
    tmpfs:
      - /tmp:size=64M,exec

    # 3. Güvenlik İzolasyonu
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

    # 4. Log Yönetimi (Disk dolmasını önler)
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
